<script>

<body class="bg-slate-100 dark:bg-black font-[Inter]" style="font-family: 'Inter', sans-serif;">

                </button>
            </div>

                    Settings
                </a>
            </nav>

            <!-- Bottom user info -->
            <div class="px-4 py-4 border-t border-slate-100 dark:border-zinc-800 bg-slate-50 dark:bg-zinc-900/50 flex items-center justify-between">
                <div id="sidebar-stats" class="text-slate-500 dark:text-zinc-400 font-medium text-[11px] space-y-1 px-2">

                </div>
                <button onclick="app.toggleTheme()" class="p-2 rounded-lg bg-white dark:bg-slate-700 text-slate-500 dark:text-zinc-300 border border-slate-200 dark:border-zinc-700 hover:bg-slate-50 dark:hover:bg-zinc-800 transition-colors shadow-sm">

                        <svg class="w-3.5 h-3.5 text-slate-500 dark:text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        <span id="timer-text" class="text-slate-700 dark:text-zinc-200 font-mono font-semibold text-xs md:text-sm">0:00</span>

                    <button id="topbar-pause" onclick="app.togglePause()" class="pause-btn hidden text-xs font-medium text-slate-600 dark:text-zinc-300 bg-white dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800 px-3 py-1.5 rounded-lg hover:bg-slate-50 dark:bg-zinc-900 shadow-sm" style="display:none;">
                        Pause
                    </button>
                    <button onclick="app.navigate('quiz')" class="px-3 md:px-4 py-1.5 md:py-2 text-xs md:text-sm font-semibold text-white rounded-lg transition-all duration-200 hover:opacity-90 active:scale-95 shadow-sm bg-blue-600 hover:bg-blue-700 whitespace-nowrap">
                        <span class="hidden sm:inline">Start Quiz</span>
                        <span class="sm:hidden">Start</span>
                    </button>
                </div>
            </header>

            <!-- Scrollable content -->
            <main id="app-container" class="flex-1 overflow-y-auto p-4 md:p-8">
                <!-- Content injected here -->
            </main>
